name: CI

# Runs the full quality gate on every push (any branch) and every pull request.
# Pinned to the same Flutter version as release.yml so CI matches release builds.
on:
  push:
  pull_request:

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated files (*.g.dart, *.freezed.dart) are committed, so a clean
      # checkout compiles without build_runner and CI does not need to run it.
      # Instead, regenerate and fail if the committed outputs are stale — this
      # is faster than an unconditional build and actually guards the checkout.
      - name: Verify committed generated files are not stale
        run: |
          dart run build_runner build --delete-conflicting-outputs
          if ! git diff --quiet; then
            echo "::error::Committed generated files are stale. Run 'dart run build_runner build --delete-conflicting-outputs' and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      # Plain analysis, with infos kept non-fatal. The suite currently emits two
      # unawaited_futures INFO diagnostics in a test file; this must not fail CI
      # and must not depend on a separate fix landing first. --no-fatal-infos
      # guarantees that on every Flutter version (newer analyze treats infos as
      # fatal by default); it is NOT --fatal-infos. Warnings and errors still fail.
      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce file-length policy
        run: bash tool/check_file_length.sh

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: error
