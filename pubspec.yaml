name: pdf_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Strict Constraints
  pdfrx: ^2.4.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  sqflite: ^2.3.3
  uuid: ^4.4.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  collection: ^1.19.1
  json_annotation: ^4.9.0
  file_picker: ^12.0.0-beta.5
  permission_handler: ^12.0.1
  sqflite_common_ffi: ^2.3.3
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^33.2.6
  share_plus: ^13.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600

flutter_native_splash:
  # Brand teal background — matches the Flutter SplashScreen widget.
  color: "#0E6B72"
  color_dark: "#073D42"

  # Centered logo drawn on the native splash.
  image: assets/splash_logo.png
  image_dark: assets/splash_logo.png

  # Fill the entire screen (no letterboxing on Android 12+).
  fullscreen: true

  android_12:
    # Android 12+ uses the new SplashScreen API — same brand teal.
    color: "#0E6B72"
    color_dark: "#073D42"
    image: assets/splash_logo.png
    image_dark: assets/splash_logo.png
