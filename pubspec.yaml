name: sefer
description: "A clean, offline-first PDF reader for Android."
publish_to: 'none'

version: 1.1.0+4

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  
  # Strict Constraints
  pdfrx: ^2.4.0
  flutter_riverpod: ^3.3.1
  go_router: ^17.2.3
  sqflite: ^2.3.3
  uuid: ^4.4.0
  freezed_annotation: ^3.1.0
  path_provider: ^2.1.3
  path: ^1.9.0
  collection: ^1.19.1
  json_annotation: ^4.9.0
  file_picker: ^12.0.0-beta.5
  permission_handler: ^12.0.1
  sqflite_common_ffi: ^2.3.3
  shared_preferences: ^2.5.5
  syncfusion_flutter_pdf: ^33.2.6
  share_plus: ^13.1.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^3.2.5
  json_serializable: ^6.9.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/fonts/

  fonts:
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/DMSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/DMSans-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
        - asset: assets/fonts/Fraunces-BoldItalic.ttf
          weight: 700
          style: italic

flutter_launcher_icons:
  android: true
  ios: true
  image_path: branding/app_icon.png
  min_sdk_android: 33
  adaptive_icon_background: "#F7F8F4"
  adaptive_icon_foreground: branding/app_icon_foreground.png
  adaptive_icon_monochrome: branding/app_icon_monochrome.png
  remove_alpha_ios: true
  background_color_ios: "#F7F8F4"

flutter_native_splash:
  # Must match SplashScreen in lib/features/home/presentation/splash_screen.dart
  # so the native and Flutter launch frames read as one screen.
  color: "#1B5E4B"
  color_dark: "#0F3D31"

  image: branding/splash_logo.png
  image_dark: branding/splash_logo.png

  # Keep the native splash within the safe area so the status bar stays
  # visible — fullscreen hid the clock, battery and signal icons.
  fullscreen: false

  android_12:
    color: "#1B5E4B"
    color_dark: "#0F3D31"
    image: assets/splash_icon.png
    image_dark: assets/splash_icon.png
